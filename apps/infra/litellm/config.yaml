# ============================================================
# ROUTING STRATEGY
# ============================================================
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 30
  allowed_fails: 3
  cooldown_time: 60
  disable_spend_logs: false

# ============================================================
# FALLBACK CHAINS
# Tier 7 (M3) -> Tier 6 (M2.7) -> Tier 4 (21x Groq)
# Tier 6 (M2.7) -> Tier 4 (Groq)
# Tier 4 (Groq) -> Tier 3 (gpt-oss-20b) -> Tier 4 (autre cle)
# ============================================================
litellm_settings:
  drop_params: true
  fallbacks:
    - tier-7-constructeur: [tier-6-ouvrier, tier-4-groq]
    - tier-6-ouvrier:      [tier-4-groq]
    - tier-4-groq:         [tier-3-formatteur]
    - tier-3-formatteur:   [tier-4-groq]
  context_window_fallbacks:
    - tier-7-constructeur: [tier-4-groq]
  telemetry: false

# ============================================================
# GENERAL SETTINGS
# ============================================================
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  proxy_batch_write_at: 5
  enforce_user_param: false

# ============================================================
# UI DASHBOARD
# ============================================================
ui:
  litellm_dashboard: true