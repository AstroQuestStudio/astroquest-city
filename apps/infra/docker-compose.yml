# ============================================================
# AstroQuest City — Stack infra (LiteLLM + Redis + PostgreSQL)
# Deploy sur VPS3 (Hetzner)
# ============================================================

services:
  # ---- LiteLLM Proxy ----
  litellm:
    image: ghcr.io/berriai/litellm-database:v1.85.0
    container_name: aq-litellm
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - litellm-data:/root/.litellm
    environment:
      # === Auth ===
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      # === Database ===
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      # === Providers ===
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      GROQ_KEY_01: ${GROQ_KEY_01}
      GROQ_KEY_02: ${GROQ_KEY_02}
      GROQ_KEY_03: ${GROQ_KEY_03}
      GROQ_KEY_04: ${GROQ_KEY_04}
      GROQ_KEY_05: ${GROQ_KEY_05}
      GROQ_KEY_06: ${GROQ_KEY_06}
      GROQ_KEY_07: ${GROQ_KEY_07}
      GROQ_KEY_08: ${GROQ_KEY_08}
      GROQ_KEY_09: ${GROQ_KEY_09}
      GROQ_KEY_10: ${GROQ_KEY_10}
      GROQ_KEY_11: ${GROQ_KEY_11}
      GROQ_KEY_12: ${GROQ_KEY_12}
      GROQ_KEY_13: ${GROQ_KEY_13}
      GROQ_KEY_14: ${GROQ_KEY_14}
      GROQ_KEY_15: ${GROQ_KEY_15}
      GROQ_KEY_16: ${GROQ_KEY_16}
      GROQ_KEY_17: ${GROQ_KEY_17}
      GROQ_KEY_18: ${GROQ_KEY_18}
      GROQ_KEY_19: ${GROQ_KEY_19}
      GROQ_KEY_20: ${GROQ_KEY_20}
      GROQ_KEY_21: ${GROQ_KEY_21}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--num_workers"
      - "4"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---- PostgreSQL (LiteLLM virtual keys + logs) ----
  db:
    image: postgres:16-alpine
    container_name: aq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Pas exposé à l'extérieur — uniquement réseau interne Docker

  # ---- Redis (cache + futures queues) ----
  redis:
    image: redis:7-alpine
    container_name: aq-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  litellm-data:
  postgres-data:
  redis-data:

networks:
  default:
    name: aq-net